    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="live_tender_bd_admin" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Live Tender BD</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Firebase SDKs -->
    <script
      src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
      defer
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      defer
    ></script>

    <script type="module">
      const firebaseConfig = {
        apiKey: "AIzaSyDP7V4EBVabIZnlt3hrN3R0o06j2s9IzlU",
        authDomain: "livetenderbdadmin.firebaseapp.com",
        projectId: "livetenderbdadmin",
        storageBucket: "livetenderbdadmin.appspot.com",
        messagingSenderId: "928307222734",
        appId: "1:928307222734:web:2a42bcee8f1ac25240589f",
      };

      firebase.initializeApp(firebaseConfig);
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #ffffff;
      }

      #loading {
        text-align: center;
      }

      #loading img {
        width: 80px;
        height: 80px;
      }

      #loading p {
        margin-top: 20px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: #3498db;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 8px solid #f3f3f3;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <img src="icons/logo.png" alt="Live Tender BD" />
      <div class="spinner"></div>
      <p>Loading, please wait...</p>
    </div>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        document.getElementById("loading").style.display = "none";
      });
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
